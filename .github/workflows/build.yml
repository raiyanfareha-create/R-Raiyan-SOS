name: Generate Ar Raiyan SOS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # এই অফিশিয়াল অ্যাকশনটি নিজেই পুরো গ্র্যাডল এনভায়রনমেন্ট ও র‍্যাপার তৈরি করে নেবে
    - name: Setup and Run Gradle Build
      uses: gradle/actions/setup-gradle@v3
      with:
        arguments: assembleDebug

    - name: Upload APK Package
      uses: actions/upload-artifact@v4
      with:
        name: Ar-Raiyan-SOS-Guard-APK
        path: app/build/outputs/apk/debug/app-debug.apk
